<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatrixL</title>
<meta property="og:title" content="MatrixL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="titlebar" id="titlebar" aria-label="Заголовок окна">
  <img src="logo.png" alt="" width="18" height="18"><span class="tb-title">MatrixL</span><span class="tb-ver" id="tbVer">v1.1.2</span>
  <span class="tb-space"></span>
  <button type="button" class="tb-btn" id="tbMin" aria-label="Свернуть окно" title="Свернуть"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8"/></svg></button>
  <button type="button" class="tb-btn" id="tbMax" aria-label="Развернуть окно" title="Развернуть"><svg viewBox="0 0 12 12" aria-hidden="true"><rect class="tb-r" x="1.5" y="1.5" width="9" height="9"/><path class="tb-r2" d="M3.5 3.5V1.5h7v7h-2"/></svg></button>
  <button type="button" class="tb-btn tb-close" id="tbClose" aria-label="Закрыть" title="Закрыть"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
</div>
<svg class="bg-squares" aria-hidden="true" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="bgSq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs>
  <g fill="url(#bgSq)">
    <rect class="sq" x="70" y="120" width="150" height="150" style="opacity:0.16;animation-duration:26s;animation-delay:0s"/>
    <rect class="sq" x="330" y="60" width="46" height="46" style="opacity:0.22;animation-duration:19s;animation-delay:-4s"/>
    <rect class="sq" x="150" y="420" width="70" height="70" style="opacity:0.18;animation-duration:23s;animation-delay:-9s"/>
    <rect class="sq" x="60" y="700" width="38" height="38" style="opacity:0.2;animation-duration:17s;animation-delay:-2s"/>
    <rect class="sq" x="470" y="560" width="110" height="110" style="opacity:0.12;animation-duration:29s;animation-delay:-12s"/>
    <rect class="sq" x="620" y="780" width="52" height="52" style="opacity:0.2;animation-duration:21s;animation-delay:-6s"/>
    <rect class="sq" x="900" y="90" width="90" height="90" style="opacity:0.12;animation-duration:27s;animation-delay:-3s"/>
    <rect class="sq" x="1180" y="40" width="40" height="40" style="opacity:0.22;animation-duration:18s;animation-delay:-10s"/>
    <rect class="sq" x="1280" y="230" width="130" height="130" style="opacity:0.15;animation-duration:25s;animation-delay:-7s"/>
    <rect class="sq" x="1500" y="120" width="56" height="56" style="opacity:0.2;animation-duration:20s;animation-delay:-1s"/>
    <rect class="sq" x="1020" y="420" width="44" height="44" style="opacity:0.16;animation-duration:22s;animation-delay:-14s"/>
    <rect class="sq" x="1400" y="520" width="76" height="76" style="opacity:0.14;animation-duration:28s;animation-delay:-5s"/>
    <rect class="sq" x="1180" y="700" width="150" height="150" style="opacity:0.14;animation-duration:31s;animation-delay:-11s"/>
    <rect class="sq" x="1520" y="760" width="42" height="42" style="opacity:0.22;animation-duration:19s;animation-delay:-8s"/>
    <rect class="sq" x="780" y="330" width="34" height="34" style="opacity:0.16;animation-duration:24s;animation-delay:-15s"/>
  </g>
</svg>

<div class="shell">
  <div class="main-col">
    <header class="topbar">
      <div class="brand">
        <img class="logo-mark" src="logo.png" alt="" width="28" height="28">
        <span class="brand-name">MatrixL</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-page="home">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 3.5l9 7.7"/><path d="M5 9.8V20h14V9.8"/><path d="M16.5 5.8V3.5H19v4.4"/><path d="M10 20v-5.2a2 2 0 0 1 4 0V20"/><circle cx="12" cy="9.2" r="1.2"/></svg>
          Главная
        </button>
        <button class="nav-item" data-page="mods">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 20.5 7.4v9.2L12 21.2 3.5 16.6V7.4z"/><path d="M3.5 7.4 12 12l8.5-4.6"/><path d="M12 12v9.2"/><path d="M7.7 5.1l8.5 4.6"/><path d="M6.6 11.4l2 1.1v2.2l-2-1.1z"/><path d="M15.4 13.6l2-1.1v2.2l-2 1.1z"/></svg>
          Моды
        </button>
        <button class="nav-item" data-page="plugins">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5a2 2 0 0 1 4 0V6h3.5a1 1 0 0 1 1 1v3.5H21a2 2 0 0 1 0 4h-2.5V19a1 1 0 0 1-1 1H14v-2.5a2 2 0 0 0-4 0V20H6.5a1 1 0 0 1-1-1v-4.5H3a2 2 0 0 1 0-4h2.5V7a1 1 0 0 1 1-1H10z"/></svg>
          Плагины
        </button>
        <button class="nav-item" data-page="modpacks">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 21 7.3 12 11.8 3 7.3z"/><path d="M3 11.6l9 4.5 9-4.5"/><path d="M3 15.9l9 4.5 9-4.5"/><path d="M8.2 7.3 12 9.2l3.8-1.9"/><path d="M12 11.8v4.3"/></svg>
          Сборки
        </button>
        <button class="nav-item" data-page="favorites">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"/><path d="M12 7.5l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/><path d="M19 3v3M17.5 4.5h3"/></svg>
          Избранное
          <span class="nav-count" id="favCount"></span>
        </button>
        <button class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </button>
      </nav>
      <div class="upd-banner" id="updBanner" role="status" hidden>
        <svg class="upd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg>
        <span class="upd-txt"><b id="updTitle"></b><small id="updSub"></small></span>
        <progress id="updBar" max="100" value="0" hidden></progress>
        <button type="button" class="btn primary upd-btn" id="updBtn">Обновить</button>
      </div>
      <div class="page-title" id="pageTitle" hidden>Главная</div>
      <div class="account" id="account"></div>
      <div class="scroll-progress" id="scrollProgress" role="progressbar" aria-label="Прокрутка страницы" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </header>

    <main class="content"><div class="content-wrap" id="content"></div></main>

  </div>
</div>

<dialog id="modal">
  <div class="m-head">
    <div class="tile" id="mTile"></div>
    <div><h2 id="mName"></h2><div class="by" id="mBy"></div></div>
  </div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot">
    <a class="btn primary" id="mOpen" target="_blank" rel="noopener">Открыть страницу мода</a>
    <button class="btn" id="mFav">В избранное</button>
    <button class="btn" id="mClose">Закрыть</button>
  </div>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

<script src="i18n.js"></script>
<script src="ui.js" defer></script>
<script src="compat.js" defer></script>
<script src="script.js" defer></script>
<script src="skinviewer.js" defer></script>
<script src="launcher.js" defer></script>
</body>
</html>
